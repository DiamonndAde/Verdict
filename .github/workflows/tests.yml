name: tests

# Runs the full LiteSVM settlement suite on every push/PR. Node-only — no Solana or Anchor
# toolchain required: the verdict program (.so + IDL), the real TxLINE txoracle program, and
# the daily_scores_roots account are all committed under tests/fixtures/, so the recorded
# Merkle proofs verify against genuine oracle state entirely offline. 19/19 must stay green.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  litesvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24+ is required, not a preference: litesvm 0.8.0's native addon aborts with
      # `std::bad_alloc` (SIGABRT) on the third BPF program execution under Node 20/22.
      # Reproduced locally on both; Node 24 runs the suite clean. 0.8.0 is the last
      # web3.js-compatible litesvm (1.x is a breaking @solana/kit rewrite), so pinning the
      # runtime is the fix. Mirrored by "engines" in package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run LiteSVM settlement suite (offline, real oracle state)
        run: npm test
