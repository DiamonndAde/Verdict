name: tests

# Runs the full LiteSVM settlement suite on every push/PR. Node-only — no Solana or Anchor
# toolchain required: the verdict program (.so + IDL), the real TxLINE txoracle program, and
# the daily_scores_roots account are all committed under tests/fixtures/, so the recorded
# Merkle proofs verify against genuine oracle state entirely offline. 19/19 must stay green.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  litesvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run LiteSVM settlement suite (offline, real oracle state)
        run: npm test
